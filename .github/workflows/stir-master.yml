# Weekly test against STIR master built from source, to catch STIR API changes before they reach a
# conda-forge release. Same tests as stir.yml (pytest with real data, the no-skip check, the headless
# smoke run), but STIR comes from a ccache-cached cmake build of UCL/STIR instead of conda-forge `stir`.
# A failure comments on one open tracking issue (label stir-master), or opens it; a later pass closes it.
name: STIR master

on:
  schedule:
    - cron: "17 4 * * 1"        # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      stir_ref:
        description: "UCL/STIR branch, tag or commit to build"
        default: master
        required: true

permissions:
  contents: read

concurrency:
  group: stir-master
  cancel-in-progress: false

jobs:
  stir-master:
    name: stir-master-ubuntu-24.04-py3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 150         # a cold build with the SWIG bindings takes most of this; a cached one much less
    defaults:
      run:
        shell: bash -leo pipefail {0}
    outputs:
      stir_sha: ${{ steps.stir.outputs.sha }}
    env:
      QT_QPA_PLATFORM: offscreen
      # the dispatch input reaches the scripts only through this variable, never pasted into them
      STIR_REF: ${{ inputs.stir_ref || 'master' }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0          # tags, for the version (hatch-vcs)

    - name: Paths for the STIR source, build, install and ccache
      # outside the checkout, at the same place in every run (ccache keys on the compiler command line)
      shell: bash
      run: |
        {
          echo "STIR_SRC=$RUNNER_TEMP/stir-src"
          echo "STIR_BUILD=$RUNNER_TEMP/stir-build"
          echo "STIR_PREFIX=$RUNNER_TEMP/stir-install"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_BASEDIR=$RUNNER_TEMP"
        } >> "$GITHUB_ENV"

    - name: Check out STIR
      id: stir
      shell: bash
      run: |
        git init -q "$STIR_SRC"
        # a branch, a tag or a full commit SHA
        git -C "$STIR_SRC" fetch -q --depth 1 https://github.com/UCL/STIR.git "$STIR_REF"
        git -C "$STIR_SRC" checkout -q FETCH_HEAD
        sha=$(git -C "$STIR_SRC" rev-parse HEAD)
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "::notice title=STIR::building UCL/STIR $sha ($STIR_REF)"

    - name: Setup conda environment
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: stir-master
        # STIR's build dependencies (as for its conda-forge recipe, without ITK and ROOT) plus the viewer's
        create-args: >-
          python=3.12
          c-compiler
          cxx-compiler
          cmake
          ninja
          ccache
          swig
          libboost-devel
          hdf5
          nlohmann_json
          numpy
          pyside6
          pyqtgraph>=0.13.7
          pytest
          pip
        cache-environment: true
        cache-downloads: true

    - name: Qt system libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

    - name: Restore the ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        # exact hit for a re-run on the same commit; otherwise the newest cache from an earlier commit
        key: ccache-stir-master-${{ runner.os }}-${{ steps.stir.outputs.sha }}
        restore-keys: |
          ccache-stir-master-${{ runner.os }}-

    - name: Build and install STIR
      run: |
        ccache --zero-stats
        start=$(date +%s)
        cmake -S "$STIR_SRC" -B "$STIR_BUILD" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$STIR_PREFIX" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DBUILD_SWIG_PYTHON=ON \
          -DPython_EXECUTABLE="$(command -v python)" \
          -DPYTHON_EXECUTABLE="$(command -v python)" \
          -DPYTHON_DEST="$STIR_PREFIX/python" \
          -DDISABLE_ITK=ON \
          -DDISABLE_CERN_ROOT=ON \
          -DBUILD_TESTING=OFF
        cmake --build "$STIR_BUILD" --parallel "$(nproc)"
        cmake --install "$STIR_BUILD"
        echo "::notice title=STIR build::$(( $(date +%s) - start )) s; ccache: $(ccache --print-stats | awk -F'\t' '$1=="direct_cache_hit"||$1=="preprocessed_cache_hit"{h+=$2} $1=="cache_miss"{m=$2} END{print h+0" hits, "m+0" misses"}')"
        ccache --show-stats

    - name: Save the ccache
      # saved even when the tests below fail, so the next run still starts warm
      if: always() && steps.stir.outputs.sha != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-stir-master-${{ runner.os }}-${{ steps.stir.outputs.sha }}

    - name: Point Python and STIR at the install
      run: |
        config=$(ls -d "$STIR_PREFIX"/share/STIR-*/config | sort | tail -n 1)
        test -f "$config/radionuclide_info.json"
        echo "$config" > .stir_config_dir
        echo "STIR_CONFIG_DIR=$config" >> "$GITHUB_ENV"
        echo "PYTHONPATH=$STIR_PREFIX/python" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$STIR_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

    - name: Install the viewer without dependencies (conda provides them)
      run: |
        python -m pip install --no-deps -e .
        python -c "import stir, pet_projection_data_visualization; print('stir from', stir.__file__)"

    - name: Take the STIR test data from the same commit
      run: |
        mkdir -p stir_data
        for f in examples/recon_demo/smalllong.hs examples/recon_demo/smalllong.s \
                 recon_test_pack/Utahscat600k_ca_seg4.hs recon_test_pack/Utahscat600k_ca_seg4.s; do
          cp "$STIR_SRC/$f" stir_data/
        done
        ls -l stir_data

    - name: pytest with STIR master
      run: |
        source scripts/ci_stir_env.sh
        for hs in stir_data/smalllong.hs stir_data/Utahscat600k_ca_seg4.hs; do
          echo "::group::pytest on $hs"
          STIR_TEST_PROJDATA="$hs" python -m pytest -ra --junitxml="pytest-$(basename "$hs" .hs).xml" 2>&1 | tee -a pytest.log
          echo "::endgroup::"
        done
        STIR_TEST_PROJDATA=stir_data/smalllong.hs python -m pytest -q tests/stir_interface/test_real_stir_integration.py -rs \
          | tee real_stir.log
        if grep -q "SKIPPED" real_stir.log; then echo "real-STIR tests were skipped"; exit 1; fi

    - name: Report pytest failures as annotations
      if: failure()
      run: python scripts/ci_annotate.py pytest.log

    - name: Smoke run of the real window on STIR data
      run: |
        source scripts/ci_stir_env.sh
        python scripts/ci_smoke.py stir_data/smalllong.hs --out ci_smoke.png

    - name: Upload test results for debugging
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: stir-master
        path: |
          pytest-*.xml
          real_stir.log
          pytest.log
          ci_smoke.png
        retention-days: 7

  # A separate job, so only this one gets issues: write and the build never holds a writable token.
  # Runs only for master: a manual run on another ref does not touch the tracking issue.
  report:
    needs: stir-master
    if: >-
      always() && (inputs.stir_ref || 'master') == 'master' &&
      (needs.stir-master.result == 'failure' || needs.stir-master.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.stir-master.result }}
      STIR_SHA: ${{ needs.stir-master.outputs.stir_sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: scripts
    - name: Open, update or close the tracking issue
      run: |
        sha=${STIR_SHA:-unknown}
        if [ "$RESULT" = failure ]; then
          mode=fail
          printf '%s\n' "The weekly test against STIR master failed." "" \
            "- Run: $RUN_URL" "- UCL/STIR commit: https://github.com/UCL/STIR/commit/$sha" > body.md
        else
          mode=pass
          printf '%s\n' "Passed again against UCL/STIR $sha: $RUN_URL" > body.md
        fi
        bash scripts/ci_tracking_issue.sh "$mode" stir-master "CI against STIR master is failing" body.md
