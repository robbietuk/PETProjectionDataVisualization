# Real-STIR job. Modelled on STIR's conda jobs in build-test.yml (setup-micromamba with caching,
# login shell so the environment is active) and on how STIR runs its Python tests:
# pytest with real projection data, then an example run.
# conda-forge's `stir` 6.4.0 is built for linux-64, osx-64, osx-arm64 and win-64, Python 3.11 to 3.14.
name: real STIR

on:
  push:
    # every branch, so pushed work branches are tested before they are merged
    paths-ignore:
      - '**/*.md'
      - '**/*.html'
      - '**/*.htm'
      - '**/*.tex'
      - 'CITATION.cff'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.html'
      - '**/*.htm'
      - '**/*.tex'
      - 'CITATION.cff'
      - 'docs/**'
  workflow_dispatch:

env:
  # STIR release the test data is taken from (raw files from github.com/UCL/STIR)
  STIR_DATA_TAG: rel_6.4.0

jobs:
  stir:
    defaults:
      run:
        # activate the conda environment in every step, as STIR's CI does
        shell: bash -leo pipefail {0}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.12"]
      fail-fast: false
    name: stir-${{ matrix.os }}-py${{ matrix.python-version }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v4

    - name: Setup conda environment
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: stir-viewer
        create-args: >-
          python=${{ matrix.python-version }}
          stir
          numpy
          pyside6
          pyqtgraph>=0.13.7
          pytest
          pip
        cache-environment: true
        cache-downloads: true

    - name: Qt system libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

    - name: Install the viewer without dependencies (conda provides them)
      run: |
        python -m pip install --no-deps -e .
        python -c "import stir, stir_projdata_viewer; print('stir from', stir.__file__)"

    - name: Point STIR at its config files
      # conda-forge's win-64 stir 6.4.0 ships <prefix>/Library/share/STIR-6.4/config but looks for
      # <prefix>/share/STIR-6.3/config; STIR_CONFIG_DIR is STIR's documented override. Harmless elsewhere.
      run: |
        cfg=$(python -c "import glob,os,sys; c=sorted(glob.glob(os.path.join(sys.prefix,'Library','share','STIR-*','config'))+glob.glob(os.path.join(sys.prefix,'share','STIR-*','config'))); print(c[-1] if c else '')")
        echo "::notice title=STIR config dir::${cfg:-not found under the env prefix}"
        if [ -n "$cfg" ]; then echo "STIR_CONFIG_DIR=$cfg" >> "$GITHUB_ENV"; fi
        python -c "import os; print('STIR_CONFIG_DIR =', os.environ.get('STIR_CONFIG_DIR'))"

    - name: Fetch STIR test data
      run: |
        mkdir -p stir_data
        base=https://raw.githubusercontent.com/UCL/STIR/${STIR_DATA_TAG}
        for f in examples/recon_demo/smalllong.hs examples/recon_demo/smalllong.s \
                 recon_test_pack/Utahscat600k_ca_seg4.hs recon_test_pack/Utahscat600k_ca_seg4.s; do
          curl -fsSL --retry 3 -o "stir_data/$(basename "$f")" "$base/$f"
        done
        ls -l stir_data

    - name: pytest with real STIR
      run: |
        echo "::notice title=STIR_CONFIG_DIR in pytest step::${STIR_CONFIG_DIR:-unset}"
        for hs in stir_data/smalllong.hs stir_data/Utahscat600k_ca_seg4.hs; do
          echo "::group::pytest on $hs"
          # -rs lists skips; the real-STIR tests must not be among them
          STIR_TEST_PROJDATA="$hs" python -m pytest -ra --junitxml="pytest-$(basename "$hs" .hs).xml" 2>&1 | tee -a pytest.log
          echo "::endgroup::"
        done
        STIR_TEST_PROJDATA=stir_data/smalllong.hs python -m pytest -q tests/stir_interface/test_real_stir_integration.py -rs \
          | tee real_stir.log
        if grep -q "SKIPPED" real_stir.log; then echo "real-STIR tests were skipped"; exit 1; fi

    - name: Report pytest failures as annotations
      if: failure()
      run: python scripts/ci_annotate.py pytest.log

    - name: Smoke run of the real window on STIR data
      run: python scripts/ci_smoke.py stir_data/smalllong.hs --out ci_smoke.png

    - name: Upload test results for debugging
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: stir-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          pytest-*.xml
          real_stir.log
          pytest.log
          ci_smoke.png
        retention-days: 7
