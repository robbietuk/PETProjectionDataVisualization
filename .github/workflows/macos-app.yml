# Build the double-clickable macOS app (with STIR inside) and upload it, zipped, as an artifact.
# See packaging/macos/README.md.
name: macos-app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  app:
    runs-on: macos-latest   # Apple Silicon
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Fetch STIR's small test data set
      run: |
        mkdir -p build/sample
        for ext in hs s; do
          curl -fsSL -o "build/sample/smalllong.$ext" \
            "https://raw.githubusercontent.com/UCL/STIR/master/examples/recon_demo/smalllong.$ext"
        done
    - name: Build, sign and self-test the app
      env:
        STIR_TEST_PROJDATA: ${{ github.workspace }}/build/sample/smalllong.hs
      run: packaging/macos/build_app.sh
    - name: Zip
      run: |
        cd dist
        ditto -c -k --sequesterRsrc --keepParent PETProjectionDataVisualization.app \
          "PETProjectionDataVisualization-macos-$(uname -m).zip"
    - uses: actions/upload-artifact@v4
      with:
        name: PETProjectionDataVisualization-macos
        path: |
          dist/*.zip
          build/selftest_*.png
