# TEMPORARY: native backtrace of the Linux / Python 3.11 abort in the Qt tests. Removed before merge.
name: debug abort
on:
  push:
    branches: [feature/lock-levels]
jobs:
  gdb:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 gdb
        python -m pip install -U pip
        python -m pip install -e ".[test]"
        pip list | grep -i -E "pyside|shiboken|pyqtgraph|numpy"
    - name: level-lock file alone
      run: python -X faulthandler -m pytest -v -p no:cacheprovider tests/view/test_level_lock_real_qt.py 2>&1 | tail -40 || true
    - name: gdb backtrace, view tests
      run: |
        gdb -q -batch -ex "set pagination off" -ex run -ex "bt 40" -ex "py-bt" --args \
          python -X faulthandler -m pytest -v -p no:cacheprovider tests/view 2>&1 | tail -150 || true
    - name: gdb backtrace, full suite
      run: |
        gdb -q -batch -ex "set pagination off" -ex run -ex "bt 40" --args \
          python -X faulthandler -m pytest -q -p no:cacheprovider 2>&1 | tail -120 || true
