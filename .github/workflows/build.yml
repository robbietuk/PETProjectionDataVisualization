# Build the wheel and source archive, check they install and run in a clean environment,
# and publish on a version tag (TestPyPI first, then PyPI) with PyPI trusted publishing.
# Before the first tag: add trusted publishers for this repository on test.pypi.org and pypi.org
# (workflow `build.yml`, environments `testpypi` and `pypi`).
name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dist:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build wheel and sdist
      run: |
        python -m pip install -U pip build
        python -m build
        ls -l dist
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  check-install:
    needs: dist
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        kind: [wheel, sdist]
      fail-fast: false
    name: install-${{ matrix.kind }}-${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4     # only for scripts/ci_smoke.py
      with:
        sparse-checkout: scripts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - name: Qt system libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - name: Install into a clean venv and run
      run: |
        python -m venv clean
        if [ -f clean/bin/activate ]; then source clean/bin/activate; else source clean/Scripts/activate; fi
        if [ "${{ matrix.kind }}" = wheel ]; then pkg=$(ls dist/*.whl); else pkg=$(ls dist/*.tar.gz); fi
        python -m pip install "$pkg"
        pet-projection-data-visualization --help
        # run from outside the checkout so the installed package is the one imported
        cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/scripts/ci_smoke.py" --demo --out ci_smoke.png

  publish-testpypi:
    needs: check-install
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - uses: pypa/gh-action-pypi-publish@release/v1
