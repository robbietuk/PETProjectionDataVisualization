# Main test job. Modelled on STIR's build-test.yml: same kind of triggers and paths-ignore,
# a matrix that runs to the end (fail-fast: false), and logs uploaded on failure.
# Runs the same command as locally: `pytest` from the repository root (offscreen Qt).
# The real-STIR tests skip here; they run in stir.yml.
name: tests

on:
  push:
    branches:
      - main
  pull_request:
    # pull requests into any branch (stacked PRs included): every PR is tested once, before merging
  workflow_dispatch:
  # build.yml calls this before publishing a release
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        pyside6: [""]           # "": whatever pip resolves from pyproject.toml
        experimental: [false]   # true only in an include below, for a Python that may still fail
        include:
          # A Python that PySide6, numpy or pyqtgraph don't support yet can be tried here first with
          # `experimental: true`: the job is then named "(allowed to fail)" and never blocks a merge.
          # Move it into python-version above (and add its classifier) once it passes reliably.
          # PySide6 6.12.0 over-releases None/True/False on Linux; pip will not pick it with Python 3.11
          # (pyproject.toml), so force it here to prove the start-up guard (_refcount_guard.py) holds.
          # A separate job: pyside6 differs from the "" above, so this include cannot merge into ubuntu/3.11.
          - os: ubuntu-24.04
            python-version: "3.11"
            pyside6: "6.12.0"
      # let's run all of them, as opposed to aborting when one fails (as in STIR)
      fail-fast: false
    name: ${{ matrix.os }}-py${{ matrix.python-version }}${{ matrix.pyside6 && format('-pyside{0}', matrix.pyside6) || '' }}${{ matrix.experimental && ' (allowed to fail)' || '' }}
    # a failing experimental job shows as a warning and does not fail the workflow or block a merge
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0          # tags, for the version (hatch-vcs)

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true # the newest Python may still be a release candidate
        cache: pip

    - name: Qt system libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

    - name: Install
      run: |
        python -m pip install -U pip
        python -m pip install -e ".[test]"

    - name: Force a PySide6 version (only where the matrix names one)
      if: matrix.pyside6
      run: python -m pip install "PySide6==${{ matrix.pyside6 }}"

    - name: pytest
      shell: bash
      run: |
        set -o pipefail
        python -m pytest -ra --junitxml=pytest-results.xml 2>&1 | tee pytest.log

    - name: Report pytest failures as annotations
      if: failure()
      shell: bash
      run: python scripts/ci_annotate.py pytest.log

    - name: Smoke run of the real window (demo data)
      run: python scripts/ci_smoke.py --demo --out ci_smoke.png

    - name: Upload test results for debugging
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}${{ matrix.pyside6 && format('-pyside{0}', matrix.pyside6) || '' }}
        path: |
          pytest-results.xml
          pytest.log
          ci_smoke.png
        retention-days: 7
