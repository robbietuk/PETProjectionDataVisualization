# TEMPORARY: the real app's playback on Linux / Python 3.11 / PySide6 6.12.0, without and with the guard.
name: debug none refcount
on:
  push:
    branches: [feature/lock-levels]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        guard: [noguard, guard]
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - run: python -m pip install "PySide6==6.12.0" pyqtgraph numpy
    - run: python -X faulthandler .github/debug/probe_none.py ${{ matrix.guard }} 2>&1 | grep -v "Stack\|File " | tail -20; echo "exit status ${PIPESTATUS[0]}"
      shell: bash
