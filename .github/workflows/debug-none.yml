# TEMPORARY: measure None's refcount drift per PySide6 version on Python 3.11. Removed before merge.
name: debug none refcount
on:
  push:
    branches: [feature/lock-levels]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        pyside: ["6.8.3", "6.9.3", "6.10.3", "6.11.3", "6.12.0"]
        include:
          - {os: ubuntu-24.04, pyside: "6.12.0", numpy: "==2.3.5"}
          - {os: macos-latest, pyside: "6.12.0"}
          - {os: windows-latest, pyside: "6.12.0"}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - run: python -m pip install "PySide6==${{ matrix.pyside }}" pyqtgraph "numpy${{ matrix.numpy }}"
    - run: python -X faulthandler .github/debug/probe_none.py
