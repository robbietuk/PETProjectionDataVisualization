# On-demand Claude: mention @claude in an issue or pull request comment, or in a pull request review, to
# ask a question or have it make a change. Only the owner, members and collaborators can call it.
# On an issue it works on a new `claude/...` branch and replies with a link to open the pull request;
# on a pull request it can push to that pull request's branch. It does not run on pull requests from forks
# (it would run the fork's code with a push token): use `/review` there. It only sees comments from the
# repository owner and the agents. See docs/AGENT_WORKFLOW.md.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    name: "agent: claude"
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # the Claude GitHub App's token does the writing; this job's own token is in Claude's environment too,
    # so it stays read-only
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: read
      id-token: write        # the Claude GitHub App token is obtained through OIDC
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Refuse pull requests from forks
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? (context.payload.issue?.pull_request ? context.payload.issue.number : null);
            let fork = false;
            if (number) {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
              fork = pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`;
            }
            if (fork) core.notice('@claude does not run on pull requests from forks; comment /review instead');
            core.setOutput('fork', String(fork));

      - uses: actions/checkout@v4
        if: steps.guard.outputs.fork == 'false'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.fork == 'false'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project, the Qt libraries and pre-commit
        if: steps.guard.outputs.fork == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install -U pip
          python -m pip install -e ".[test]" pre-commit

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.fork == 'false'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          include_comments_by_actor: "${{ github.repository_owner }},claude[bot],github-actions[bot]"
          additional_permissions: |
            actions: read
            checks: read
          claude_args: |
            --model ${{ vars.AGENT_MODEL || 'claude-opus-5-5' }}
            --max-turns 150
            --allowedTools "Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pytest:*),Bash(pre-commit:*),Bash(ruff:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh api:*)"
