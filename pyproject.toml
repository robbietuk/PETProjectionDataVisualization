[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "PETProjectionDataVisualization"
# The version comes from the latest git tag vMAJOR.MINOR.PATCH (semantic versioning); see
# [tool.hatch.version] below and CONTRIBUTING.md, "Releasing". The git tag is the only source of truth.
dynamic = ["version"]
description = "Interactive PySide6 viewer for STIR projection data (sinograms, viewgrams, TOF bins)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Robert Twyman Skelly", email = "robbietuk@gmail.com" }]
keywords = ["PET", "STIR", "sinogram", "projection data", "time of flight", "visualization", "Qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "numpy>=1.24.3",
    # PySide6 6.12.0 over-releases None/True/False on Linux; Python 3.11 then aborts (3.12+ is immune).
    # See src/pet_projection_data_visualization/_refcount_guard.py and README, "Known limitations".
    "PySide6>=6.6,!=6.12.*; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
    "pyqtgraph>=0.13.7",
]
# NOTE: `stir` is deliberately NOT listed. It is a compiled SWIG extension that
# is not on PyPI; it is discovered at run time (see docs/PLAN.md, "Getting STIR").

[project.urls]
Homepage = "https://github.com/robbietuk/PETProjectionDataVisualization"
Source = "https://github.com/robbietuk/PETProjectionDataVisualization"
Issues = "https://github.com/robbietuk/PETProjectionDataVisualization/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pet-projection-data-visualization = "pet_projection_data_visualization.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Only vMAJOR.MINOR.PATCH (optionally aN/bN/rcN) tags count; this is the same rule as
# scripts/release_notes.py, kept in sync by tests/test_release_tooling.py. Other tags are ignored.
tag_regex = "^v(?P<version>(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)(?:(?:a|b|rc)(?:0|[1-9][0-9]*))?)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
# Used when there is no git metadata (e.g. a GitHub "Download ZIP"); before the first v* tag it is also
# the base of development versions (0.0.1.devN+...). Release builds always come from a tag.
fallback_version = "0.0.0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "src/pet_projection_data_visualization/_version.py"

[tool.hatch.build.targets.sdist]
# an explicit list, so local folders (virtual envs, worktrees, app builds) never end up in the sdist
include = [
    # anchored with a leading "/": an unanchored "src/" or "tests/" also matches such folders
    # nested inside a virtual env or build/ and drags them in
    "/src/",
    "/tests/",
    "/scripts/",
    "/packaging/",
    "/typings/",          # type stubs used by the type check ([tool.pyrefly])
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/docs/PLAN.md",
    "/environment.yml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pet_projection_data_visualization"]
# the stub only stands in for _version.py in a checkout that has none; the wheel always has the real (typed)
# _version.py, and a shipped stub would hide its other names (version_tuple, commit_id, ...) from type checkers
exclude = ["/src/pet_projection_data_visualization/_version.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.pyrefly]
# Strict static type checking with Pyrefly, run by pre-commit (see CONTRIBUTING.md, "Type checking").
# The tests are not checked: they assert on optional view-model state and monkeypatch fakes on purpose.
project-includes = ["src", "scripts", "packaging", "typings"]
# typings/ holds partial stubs for pyqtgraph, which ships no type information (it shadows the real package)
search-path = ["src", "typings"]
python-version = "3.11"
# not installed where the check runs: the SWIG module (only packaging/ imports it statically) and py-rattler
ignore-missing-imports = ["stir", "rattler"]
# on top of the default checks: implicit Any of every kind (unannotated parameters, bare generics, untyped
# lambdas, ...), @override on overriding methods, unused suppressions, strict callable subtyping
preset = "strict"
infer-with-first-use = false        # an empty container needs an annotation; no guessing from its first use

[tool.pyrefly.errors]
unannotated-return = "error"        # every function declares its return type
explicit-any = "error"              # no `Any` in annotations (one alias for the SWIG boundary: swig_gateway.py)
no-any-return = "error"             # a typed function may not return an `Any`
redundant-cast = "error"
unknown-argument-type = "error"     # an implicit `Any` may not flow into calls, attributes, variables, returns
unknown-attribute-access = "error"
unknown-attribute-type = "error"
unknown-return-type = "error"
unknown-variable-type = "error"
# `bool(x)` / `int(x)` on values typed as bool/int are kept on purpose: at run time they come from Qt signals,
# numpy scalars or callers that pass other number types
unnecessary-type-conversion = "ignore"
