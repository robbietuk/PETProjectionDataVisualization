[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "PETProjectionDataVisualization"
# The version comes from the latest git tag vMAJOR.MINOR.PATCH (semantic versioning); see
# [tool.hatch.version] below and CONTRIBUTING.md, "Releasing". The git tag is the only source of truth.
dynamic = ["version"]
description = "Interactive PySide6 viewer for STIR projection data (sinograms, viewgrams, TOF bins)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Robert Twyman Skelly", email = "robbietuk@gmail.com" }]
keywords = ["PET", "STIR", "sinogram", "projection data", "time of flight", "visualization", "Qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "numpy>=1.24.3",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.7",
]
# NOTE: `stir` is deliberately NOT listed. It is a compiled SWIG extension that
# is not on PyPI; it is discovered at run time (see PLAN.md, "Getting STIR").

[project.urls]
Homepage = "https://github.com/robbietuk/PETProjectionDataVisualization"
Source = "https://github.com/robbietuk/PETProjectionDataVisualization"
Issues = "https://github.com/robbietuk/PETProjectionDataVisualization/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pet-projection-data-visualization = "pet_projection_data_visualization.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# tags look like v1.2.3; anything else (e.g. a stray "test" tag) is ignored
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:[-.]?(?:a|b|rc)[0-9]+)?)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
# only used when there is no git metadata at all (e.g. a GitHub "Download ZIP" without .git)
fallback_version = "0.0.0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "src/pet_projection_data_visualization/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_projection_data_visualization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
