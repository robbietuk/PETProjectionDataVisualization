[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "PETProjectionDataVisualization"
# The version comes from the latest git tag vMAJOR.MINOR.PATCH (semantic versioning); see
# [tool.hatch.version] below and CONTRIBUTING.md, "Releasing". The git tag is the only source of truth.
dynamic = ["version"]
description = "Interactive PySide6 viewer for STIR projection data (sinograms, viewgrams, TOF bins)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Robert Twyman Skelly", email = "robbietuk@gmail.com" }]
keywords = ["PET", "STIR", "sinogram", "projection data", "time of flight", "visualization", "Qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "numpy>=1.24.3",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.7",
]
# NOTE: `stir` is deliberately NOT listed. It is a compiled SWIG extension that
# is not on PyPI; it is discovered at run time (see PLAN.md, "Getting STIR").

[project.urls]
Homepage = "https://github.com/robbietuk/PETProjectionDataVisualization"
Source = "https://github.com/robbietuk/PETProjectionDataVisualization"
Issues = "https://github.com/robbietuk/PETProjectionDataVisualization/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pet-projection-data-visualization = "pet_projection_data_visualization.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Only vMAJOR.MINOR.PATCH (optionally aN/bN/rcN) tags count; this is the same rule as
# scripts/release_notes.py, kept in sync by tests/test_release_tooling.py. Other tags are ignored.
tag_regex = "^v(?P<version>(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)(?:(?:a|b|rc)(?:0|[1-9][0-9]*))?)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
# Used when there is no git metadata (e.g. a GitHub "Download ZIP"); before the first v* tag it is also
# the base of development versions (0.0.1.devN+...). Release builds always come from a tag.
fallback_version = "0.0.0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "src/pet_projection_data_visualization/_version.py"

[tool.hatch.build.targets.sdist]
# an explicit list, so local folders (virtual envs, worktrees, app builds) never end up in the sdist
include = [
    # anchored with a leading "/": an unanchored "src/" or "tests/" also matches such folders
    # nested inside a virtual env or build/ and drags them in
    "/src/",
    "/tests/",
    "/scripts/",
    "/packaging/",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/PLAN.md",
    "/environment.yml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pet_projection_data_visualization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
