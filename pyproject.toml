[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PETProjectionDataVisualization"
version = "0.1.0"
description = "Interactive PySide6 viewer for STIR projection data (sinograms, viewgrams, TOF bins)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Robert Twyman Skelly", email = "robbietuk@gmail.com" }]
keywords = ["PET", "STIR", "sinogram", "projection data", "time of flight", "visualization", "Qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "numpy>=1.24.3",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.7",
]
# NOTE: `stir` is deliberately NOT listed. It is a compiled SWIG extension that
# is not on PyPI; it is discovered at run time (see PLAN.md, "Getting STIR").

[project.urls]
Homepage = "https://github.com/robbietuk/PETProjectionDataVisualization"
Source = "https://github.com/robbietuk/PETProjectionDataVisualization"
Issues = "https://github.com/robbietuk/PETProjectionDataVisualization/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pet-projection-data-visualization = "pet_projection_data_visualization.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_projection_data_visualization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
